# The tmux server that holds the 3270 console sessions of a VM (pve-qemu-3270@<vmid>.service).
# The viewers attached to a session only see and use its c3270: no status line, no tmux commands,
# no key bindings except Ctrl+] to detach, and the server never exits on its own.
set -s exit-empty off
# c3270 emulates a 3279 (colour) only if TERM has colours: do not depend on the tmux default
set -s default-terminal tmux-256color
set -s escape-time 0
set -s set-clipboard off
set -g status off
set -g prefix None
set -g prefix2 None
# tmux does nothing with the mouse itself, it passes the mouse events to c3270 (menu bar, keypad,
# cursor), which asks for them
set -g mouse off
set -g destroy-unattached off
set -g history-limit 0
set -g set-titles off
set -g allow-rename off
set -g fill-character ' '
# start the command of a session again should it ever end
set -g remain-on-exit on
set-hook -g pane-died respawn-pane
unbind -a -T prefix
unbind -a -T root
unbind -a -T copy-mode
unbind -a -T copy-mode-vi
bind -n C-] detach-client
