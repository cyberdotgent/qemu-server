# s390x VM with DASDs: CKD volumes with names, an FBA disk and an FBA cloud-init drive
arch: s390x
boot: order=ckd0
ckd0: local-zfs:vm-300-SYSRS1,cylinders=3339,devno=0.0.0200,size=2846431744
ckd1: local-zfs:vm-300-WORK01,cylinders=1113,devno=0.0.0201,size=948863488
ckd2: local-zfs:vm-300-SCRTCH,backup=0,cylinders=1113,devno=0.0.0202,size=948863488
fba0: local-zfs:vm-300-disk-0,devno=0.0.0300,size=1G
fba1: local-zfs:vm-300-cloudinit,devno=0.0.0301,media=cdrom
ipl: ckd0
machine: czam
memory: 2048
net0: qeth=BC:24:11:00:03:00,bridge=vmbr0,devno=0.0.0400
ostype: other
tape0: local:iso/SYSTEM.AWS
terminal0: 0.0.0009
#qmdump#map:ckd0:drive-ckd0:local-zfs:raw:
#qmdump#map:ckd1:drive-ckd1:local-zfs:raw:
#qmdump#map:fba0:drive-fba0:local-zfs:raw:
