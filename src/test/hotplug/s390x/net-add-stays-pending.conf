# TEST: a new network device stays pending on s390x, which has no hotplug
# HOST_ARCH: s390x
# STAYS_PENDING: 1
cores: 2
memory: 2048
name: hotplug
net0: virtio=A2:C0:43:77:08:A0,bridge=vmbr0
ostype: l26
scsi0: local:8006/vm-8006-disk-0.qcow2,size=32G
scsihw: virtio-scsi-single
serial0: socket

[PENDING]
net1: virtio=BA:DC:0F:FE:E0:01,bridge=vmbr0
