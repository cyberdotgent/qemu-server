# TEST: hotplug a SCSI disk with its virtio-scsi-ccw controller on s390x
# HOST_ARCH: s390x
cores: 2
memory: 2048
name: hotplug
net0: virtio=A2:C0:43:77:08:A0,bridge=vmbr0
ostype: l26
scsi0: local:8006/vm-8006-disk-0.qcow2,size=32G
scsihw: virtio-scsi-single

[PENDING]
scsi1: local:8006/vm-8006-disk-1.qcow2,size=32G
