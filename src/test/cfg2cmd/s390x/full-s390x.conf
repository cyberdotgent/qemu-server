# TEST: s390x config using the devices and options supported on s390x
# HOST_ARCH: s390x
agent: enabled=1
balloon: 1024
boot: order=scsi0;virtio0;net0
cores: 2
memory: 4096
name: full-s390x
net0: virtio=BC:24:11:00:00:00,bridge=vmbr0,firewall=1,queues=4
net1: virtio=BC:24:11:00:00:01,bridge=vmbr1,link_down=1
net6: virtio=BC:24:11:00:00:06,bridge=vmbr2,mtu=1400,tag=42
ostype: l26
rng0: source=/dev/urandom,max_bytes=2048,period=500
scsi0: local:8006/vm-8006-disk-100.qcow2,size=1G,iothread=1
scsi1: local:8006/vm-8006-disk-101.qcow2,size=1G,ssd=1,discard=on,serial=SCSI1
scsi2: local:iso/debian.iso,media=cdrom
scsihw: virtio-scsi-pci
serial0: socket
serial1: socket
serial3: socket
smbios1: uuid=7b10d7af-b932-4c66-b2c3-3996152ec465
sockets: 2
vga: virtio,memory=64
virtio0: local:8006/vm-8006-disk-0.qcow2,size=8G,iothread=1
virtio6: local:8006/vm-8006-disk-6.qcow2,size=1G
vmgenid: c773c261-d800-4348-9f5d-167fadd53cf8
watchdog: model=i6300esb,action=reset
