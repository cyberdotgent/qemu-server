# TEST: s390x network boot of a mainframe OS VM ignores 'ipl' (QEMU refuses -ipl with -kernel)
# HOST_ARCH: s390x
machine: x-test-lpar
memory: 2048
netboot: url=https://mirror.example.com/s390x/suse.ins,kernel=local:snippets/netboot-0123456789ab.kernel,once=0
ostype: other
ipl: virtio0
virtio0: local:8006/vm-8006-disk-0.qcow2,size=8G
