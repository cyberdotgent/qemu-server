# TEST: s390x IPL from a SCSI CD-ROM with a load parameter
# HOST_ARCH: s390x
ipl: scsi1,loadparm=0A01M 1
memory: 1024
net0: virtio=BC:24:11:00:00:00,bridge=vmbr0
scsi0: local:8006/vm-8006-disk-1.qcow2,size=8G
scsi1: local:iso/mf-install.iso,media=cdrom
scsihw: virtio-scsi-pci
virtio0: local:8006/vm-8006-disk-0.qcow2,size=8G
virtio1: local:8006/vm-8006-disk-2.qcow2,size=8G
boot: order=scsi0;virtio0;net0
