# TEST: s390x network boot of an installer: kernel, initial RAM disk and command line, the disk keeps its boot index
# HOST_ARCH: s390x
machine: x-test-lpar
memory: 2048
net0: virtio=A2:C0:43:77:08:A0,bridge=vmbr0
netboot: https://mirror.example.com/centos/10-stream/BaseOS/s390x/os/generic.ins,kernel=local:snippets/netboot-0123456789ab.kernel,initrd=local:snippets/netboot-0123456789ab.initrd
netboot-cmdline: ro cio_ignore=all,!condev inst.repo=https://mirror.example.com/centos/10-stream/BaseOS/s390x/os/
ostype: l26
virtio0: local:8006/vm-8006-disk-0.qcow2,size=8G
